server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api

app:
  environment: ${APP_ENV:unset}
  project-root: ${APP_PROJECT_ROOT:}
  # Business DATETIME values use one fixed wall-clock zone on every node.
  time-zone: ${APP_TIME_ZONE:Asia/Shanghai}
  public-url: ${APP_PUBLIC_URL:https://resume.paicoding.com}
  auth:
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:pai_refresh}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-cookie-max-age-seconds: ${REFRESH_COOKIE_MAX_AGE_SECONDS:604800}
    # 派聪明服务号由 paicoding 统一持有 AppSecret/access_token。PaiResume 只通过
    # 双向 HMAC 内部网关创建临时 scene 二维码并接收可信扫码事件。
    wechat-service:
      enabled: ${PAICONGMING_WECHAT_LOGIN_ENABLED:false}
      gateway-base-url: ${PAICONGMING_WECHAT_GATEWAY_BASE_URL:}
      gateway-qr-path: ${PAICONGMING_WECHAT_GATEWAY_QR_PATH:/api/internal/pairesume/wechat/qrcodes}
      bridge-secret: ${PAICONGMING_WECHAT_BRIDGE_SECRET:}
      account-app-id: ${PAICONGMING_WECHAT_APP_ID:}
      scene-prefix: ${PAICONGMING_WECHAT_SCENE_PREFIX:pr_}
      challenge-ttl-seconds: ${PAICONGMING_WECHAT_CHALLENGE_TTL_SECONDS:300}
      bridge-clock-skew-seconds: ${PAICONGMING_WECHAT_BRIDGE_CLOCK_SKEW_SECONDS:300}
      bridge-replay-ttl-seconds: ${PAICONGMING_WECHAT_BRIDGE_REPLAY_TTL_SECONDS:600}
      challenge-create-minute-limit: ${PAICONGMING_WECHAT_CHALLENGE_CREATE_MINUTE_LIMIT:10}
  dev-account:
    email: ${DEV_ACCOUNT_EMAIL:test@example.com}
    password: ${DEV_ACCOUNT_PASSWORD:Test123456}
  dev-admin:
    email: ${DEV_ADMIN_EMAIL:admin@example.com}
    password: ${DEV_ADMIN_PASSWORD:Admin123456}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5175,http://127.0.0.1:5175,http://localhost:4173,http://127.0.0.1:4173,http://localhost:63342,http://127.0.0.1:63342,http://[::1]:5173,http://[::1]:5175,http://[::1]:4173}
  prompts:
    field-optimize:
      config-file: ${FIELD_OPTIMIZE_PROMPTS_FILE:config/field-optimize-prompts.yml}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  verification-code:
    secret: ${VERIFICATION_CODE_SECRET:development-only-change-me-32-bytes}
    ttl-seconds: ${VERIFICATION_CODE_TTL_SECONDS:300}
    resend-cooldown-seconds: ${VERIFICATION_CODE_RESEND_COOLDOWN_SECONDS:60}
    max-verify-attempts: ${VERIFICATION_CODE_MAX_ATTEMPTS:5}
    email-hourly-limit: ${VERIFICATION_CODE_EMAIL_HOURLY_LIMIT:5}
    ip-hourly-limit: ${VERIFICATION_CODE_IP_HOURLY_LIMIT:20}
  login-rate-limit:
    window-seconds: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
    email-attempt-limit: ${LOGIN_RATE_LIMIT_EMAIL_ATTEMPTS:10}
    ip-attempt-limit: ${LOGIN_RATE_LIMIT_IP_ATTEMPTS:100}
  vip-invite-rate-limit:
    window-seconds: ${VIP_INVITE_RATE_LIMIT_WINDOW_SECONDS:900}
    account-attempt-limit: ${VIP_INVITE_RATE_LIMIT_ACCOUNT_ATTEMPTS:5}
    ip-attempt-limit: ${VIP_INVITE_RATE_LIMIT_IP_ATTEMPTS:50}
  vip-invite-claim:
    ttl-seconds: ${VIP_INVITE_CLAIM_TTL_SECONDS:600}
    retention-days: ${VIP_INVITE_CLAIM_RETENTION_DAYS:30}
    cleanup-batch-size: ${VIP_INVITE_CLAIM_CLEANUP_BATCH_SIZE:500}
    cleanup-initial-delay-ms: ${VIP_INVITE_CLAIM_CLEANUP_INITIAL_DELAY_MS:60000}
    cleanup-interval-ms: ${VIP_INVITE_CLAIM_CLEANUP_INTERVAL_MS:3600000}
  marketplace:
    # User-submitted listings are fail-closed until moderation operations is ready.
    enabled: ${MARKETPLACE_ENABLED:false}
    min-price-cents: ${MARKETPLACE_MIN_PRICE_CENTS:100}
    max-price-cents: ${MARKETPLACE_MAX_PRICE_CENTS:99900}
    report-daily-ip-limit: ${MARKETPLACE_REPORT_DAILY_IP_LIMIT:10}
    report-duplicate-window-hours: ${MARKETPLACE_REPORT_DUPLICATE_WINDOW_HOURS:24}
  resume-review:
    # 只控制第三次起的人工精修付费新单；回调、查单和邮件重试始终保持可用。
    paid-accept-new-orders: ${RESUME_REVIEW_PAID_ACCEPT_NEW_ORDERS:false}
    payment-order-expire-minutes: ${RESUME_REVIEW_PAYMENT_ORDER_EXPIRE_MINUTES:30}
    recipient-email: ${RESUME_REVIEW_RECIPIENT_EMAIL:}
    message-id-domain: ${RESUME_REVIEW_MESSAGE_ID_DOMAIN:resume.paicoding.com}
    follow-official-account-name: ${RESUME_REVIEW_FOLLOW_OFFICIAL_ACCOUNT_NAME:沉默王二}
    follow-qr-code-url: ${RESUME_REVIEW_FOLLOW_QR_CODE_URL:}
    follow-bridge-enabled: ${RESUME_REVIEW_FOLLOW_BRIDGE_ENABLED:false}
    follow-bridge-hmac-secret: ${RESUME_REVIEW_FOLLOW_BRIDGE_HMAC_SECRET:}
    follow-challenge-expire-minutes: ${RESUME_REVIEW_FOLLOW_CHALLENGE_EXPIRE_MINUTES:30}
  payment:
    provider: ${PAYMENT_PROVIDER:disabled}
    # Deprecated fail-closed compatibility switch. It must stay false; use the
    # two independent switches below. A configured provider remains alive for
    # callbacks and reconciliation while new orders are paused.
    accept-new-orders: ${PAYMENT_ACCEPT_NEW_ORDERS:false}
    membership-accept-new-orders: ${MEMBERSHIP_PAYMENT_ACCEPT_NEW_ORDERS:false}
    marketplace-accept-new-orders: ${MARKETPLACE_PAYMENT_ACCEPT_NEW_ORDERS:false}
    order-expire-minutes: ${PAYMENT_ORDER_EXPIRE_MINUTES:15}
    # 会员订单固定保留 30 分钟；年费会员默认 365 天，并固化进订单快照。
    membership-order-expire-minutes: ${MEMBERSHIP_ORDER_EXPIRE_MINUTES:30}
    membership-payment-days: ${MEMBERSHIP_PAYMENT_DAYS:365}
    platform-fee-basis-points: ${MARKETPLACE_PLATFORM_FEE_BPS:0}
    creator-earning-hold-days: ${MARKETPLACE_EARNING_HOLD_DAYS:7}
    paid-order-reconciliation-interval-minutes: ${MARKETPLACE_PAID_RECONCILIATION_INTERVAL_MINUTES:360}
    paid-order-due-reconciliation-retry-minutes: ${MARKETPLACE_PAID_DUE_RECONCILIATION_RETRY_MINUTES:5}
    mock-auto-pay: ${PAYMENT_MOCK_AUTO_PAY:true}
    wechat:
      app-id: ${WECHAT_PAY_APP_ID:}
      merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
      private-key: ${WECHAT_PAY_PRIVATE_KEY:}
      merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
      api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
      notify-url: ${WECHAT_PAY_NOTIFY_URL:${app.public-url}/api/public/payments/wechat/notify}

spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  jackson:
    time-zone: ${app.time-zone}
  devtools:
    restart:
      enabled: ${DEVTOOLS_RESTART_ENABLED:false}
      additional-paths: src/main/java,src/main/resources
      poll-interval: 1s
      quiet-period: 400ms
    livereload:
      enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pai_resume}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}&useSSL=${MYSQL_USE_SSL:false}&requireSSL=${MYSQL_REQUIRE_SSL:false}&verifyServerCertificate=${MYSQL_VERIFY_SERVER_CERTIFICATE:false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 5
    locations: classpath:db/migration
    user: ${FLYWAY_USERNAME:${MYSQL_USERNAME:root}}
    password: ${FLYWAY_PASSWORD:${MYSQL_PASSWORD:123456}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: ${MAIL_TEST_CONNECTION:false}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS_ENABLE:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.enable: ${MAIL_SSL_ENABLE:false}
      mail.smtp.ssl.checkserveridentity: ${MAIL_SSL_CHECK_SERVER_IDENTITY:true}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:10000}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    db-config:
      logic-delete-field: status
      logic-delete-value: 0
      logic-not-delete-value: 1

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgc2VjdXJlIGtleSBmb3IgcGFpIHJlc3VtZSBqd3QgdG9rZW4gZ2VuZXJhdGlvbiBhbmQgdmFsaWRhdGlvbiBwdXJwb3Nl}
  issuer: ${JWT_ISSUER:pai-resume}
  audience: ${JWT_AUDIENCE:pai-resume-web}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration: 604800000

ai:
  api-key: ${AI_API_KEY:${DEEPSEEK_API_KEY:}}
  base-url: ${AI_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}}
  model: ${AI_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
  analysis-model: ${AI_ANALYSIS_MODEL:${DEEPSEEK_ANALYSIS_MODEL:${AI_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}}}
  timeout: 60

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-no-request}] [%thread] %logger{36} - %msg%n"

knife4j:
  enable: ${SPRINGDOC_ENABLED:true}
